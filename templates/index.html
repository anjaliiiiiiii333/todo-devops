<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps To-Do App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>📝 DevOps To-Do List</h1>
    <p class="subtitle">Dockerized · Deployed on AWS EC2 · Auto-deployed via GitHub Actions</p>

    <form action="/add" method="POST" class="add-form">
      <input type="text" name="task" placeholder="Add a new task..." required>
      <button type="submit">Add</button>
    </form>

    <ul class="todo-list">
      {% for todo in todos %}
      <li class="{{ 'done' if todo['done'] else '' }}">
        <a href="/toggle/{{ todo['id'] }}" class="toggle">
          {{ '✅' if todo['done'] else '⬜' }}
        </a>
        <span>{{ todo['task'] }}</span>
        <a href="/delete/{{ todo['id'] }}" class="delete">✕</a>
      </li>
      {% else %}
      <li class="empty">No tasks yet. Add one above!</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
